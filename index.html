<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NABHINFO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
color:#111;
}

.header{
background:#07162f;
padding:40px 20px;
text-align:center;
}

.logo{
font-size:70px;
font-weight:900;
color:white;
}

.header h1{
color:white;
margin-top:10px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
margin-bottom:20px;
}

.section-title{
font-size:28px;
color:#07162f;
margin-bottom:20px;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input,
select,
textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
margin-bottom:18px;
font-size:16px;
}

textarea{
height:180px;
resize:none;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.btn{
width:100%;
padding:18px;
background:#07162f;
color:white;
border:none;
border-radius:14px;
font-size:18px;
cursor:pointer;
}

.notice{
margin-top:20px;
padding:15px;
background:#fff8e7;
border:1px solid #f1d58a;
border-radius:12px;
}

@media(max-width:700px){

.grid{
grid-template-columns:1fr;
}

.logo{
font-size:50px;
}

}

</style>
</head>

<body>

<div class="header">

<div class="logo">
NABH
</div>

<h1>
منصة نبه لتوثيق معلومات المركبات
</h1>

</div>

<div class="container">

<div class="card">

<h2 class="section-title">
صور السيارة
</h2>

<input
type="file"
multiple
accept="image/*"
>

</div>

<div class="card">

<h2 class="section-title">
معلومات السيارة
</h2>

<div class="grid">

<div>
<label>اسم السيارة</label>
<input id="car_name">
</div>

<div>
<label>نوع السيارة</label>
<input id="vehicle_type">
</div>

<div>
<label>الموديل</label>
<input id="model">
</div>

<div>
<label>الممشى</label>
<input id="mileage">
</div>

<div>
<label>المدينة</label>
<input id="city">
</div>

<div>
<label>لون السيارة</label>
<input id="color">
</div>

<div>
<label>نوع القير</label>

<select id="gearbox">
<option>أوتوماتيك</option>
<option>عادي</option>
</select>

</div>

<div>
<label>دبل</label>

<select id="four_wheel_drive">
<option>نعم</option>
<option>لا</option>
</select>

</div>

</div>

<label>
رقم الواتساب
</label>

<input id="whatsapp">

<label>
ملاحظات السيارة
</label>

<textarea id="notes"></textarea>

</div>

<div class="card">

<h2 class="section-title">
المستندات
</h2>

<label>
تقرير الفحص PDF
</label>

<input
type="file"
accept=".pdf"
>

<label>
صورة الاستمارة
</label>

<input
type="file"
accept="image/*"
>

</div>

<div class="card">

<button
class="btn"
onclick="testButton()"
>
تفعيل السيارة وحفظ المعلومات
</button>

<div class="notice">

بعد التفعيل لا يمكن استخدام الملصق
على سيارة أخرى وغير قابل للتعديل.

</div>

</div>

</div>

<script>

function testButton(){

alert("الواجهة شغالة 100%");

}

</script>

</body>
</html>
