<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NABHINFO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f7fb;color:#111}
.header{background:#07162f;padding:45px 20px;text-align:center}
.logo{font-size:72px;font-weight:900;color:white;letter-spacing:3px}
.header h1{color:white;margin-top:15px;font-size:30px}
.container{max-width:980px;margin:auto;padding:30px 18px}
.card{background:white;border-radius:22px;padding:28px;margin-bottom:24px;box-shadow:0 10px 28px rgba(0,0,0,.08)}
h2{color:#07162f;font-size:28px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
label{display:block;font-weight:bold;margin-bottom:8px}
input,select,textarea{width:100%;padding:15px;border:1px solid #ddd;border-radius:14px;font-size:16px;margin-bottom:18px;background:white}
textarea{height:170px;resize:none}
.btn{width:100%;padding:18px;background:#07162f;color:white;border:none;border-radius:16px;font-size:20px;font-weight:bold;cursor:pointer}
.notice{background:#fff8e7;border:1px solid #f1d58a;border-radius:14px;padding:18px;margin-top:18px;line-height:1.8}
@media(max-width:700px){
.grid{grid-template-columns:1fr}
.logo{font-size:52px}
.header h1{font-size:22px}
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">NABH</div>
  <h1>منصة نبه لتوثيق معلومات المركبات</h1>
</div>

<div class="container">

  <div class="card">
    <h2>صور السيارة</h2>
    <input id="images" type="file" accept="image/*" multiple>
  </div>

  <div class="card">
    <h2>معلومات السيارة</h2>

    <div class="grid">
      <div>
        <label>اسم السيارة</label>
        <input id="car_name">
      </div>

      <div>
        <label>نوع السيارة</label>
        <input id="vehicle_type">
      </div>

      <div>
        <label>الموديل</label>
        <input id="model" maxlength="4" inputmode="numeric">
      </div>

      <div>
        <label>الممشى</label>
        <input id="mileage" maxlength="12" inputmode="numeric">
      </div>

      <div>
        <label>المدينة</label>
        <input id="city">
      </div>

      <div>
        <label>لون السيارة</label>
        <input id="color">
      </div>

      <div>
        <label>نوع القير</label>
        <select id="gearbox">
          <option value="">اختر</option>
          <option>أوتوماتيك</option>
          <option>عادي</option>
        </select>
      </div>

      <div>
        <label>دبل</label>
        <select id="four_wheel_drive">
          <option value="">اختر</option>
          <option>نعم</option>
          <option>لا</option>
        </select>
      </div>
    </div>

    <label>رقم الواتساب</label>
    <input id="whatsapp" placeholder="9665xxxxxxxx">

    <label>ملاحظات السيارة</label>
    <textarea id="notes" maxlength="700"></textarea>
  </div>

  <div class="card">
    <h2>المستندات</h2>

    <label>تقرير الفحص PDF</label>
    <input id="inspection_file" type="file" accept=".pdf">

    <label>صورة الاستمارة</label>
    <input id="registration_image" type="file" accept="image/*">
  </div>

  <div class="card">
    <button class="btn" onclick="testButton()">
      تفعيل السيارة وحفظ المعلومات
    </button>

    <div class="notice">
      بعد التفعيل لا يمكن استخدام الملصق على سيارة أخرى، وغير قابل للتعديل.
    </div>
  </div>

</div>

<script>
function testButton(){
  alert("الزر شغال، نكمل على نفس التصميم");
}
</script>

</body>
</html>
