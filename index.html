<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NABHINFO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
color:#111;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.header{
background:#07162f;
padding:40px 20px;
text-align:center;
margin-bottom:25px;
}

.logo{
width:320px;
max-width:90%;
display:block;
margin:auto;
}

.header h1{
color:white;
margin-top:15px;
font-size:38px;
}

.card{
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
margin-bottom:20px;
}

.section-title{
font-size:28px;
margin-bottom:20px;
color:#07162f;
font-weight:bold;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
margin-bottom:18px;
}

textarea{
resize:vertical;
min-height:180px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

@media(max-width:700px){
.grid{
grid-template-columns:1fr;
}
}

.upload-box{
border:2px dashed #d4d8df;
border-radius:16px;
padding:20px;
text-align:center;
background:white;
}

.image-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-top:15px;
}

@media(max-width:700px){
.image-grid{
grid-template-columns:repeat(2,1fr);
}
}

.image-slot{
height:120px;
border:1px solid #ddd;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
background:#fafafa;
font-size:14px;
color:#666;
}

.btn{
width:100%;
border:none;
padding:18px;
border-radius:14px;
background:#07162f;
color:white;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

.btn:hover{
opacity:.95;
}

.notice{
margin-top:20px;
background:#fff8e7;
border:1px solid #f1d58a;
padding:15px;
border-radius:12px;
font-size:15px;
}

.counter{
text-align:left;
color:#666;
font-size:14px;
margin-top:-10px;
margin-bottom:20px;
}

.required{
color:red;
}

</style>
</head>

<body>

<div class="header">

<div class="logo-text">NABH</div>

<h1>منصة نبه لتوثيق معلومات المركبات</h1>

</div>

<div class="container">

<div id="app">

<div class="card">

<h2 class="section-title">
1. صور السيارة
</h2>

<p style="margin-bottom:15px">
يمكنك إضافة حتى 8 صور فقط
</p>

<div class="upload-box">

<input
id="images"
type="file"
accept="image/*"
multiple
>

</div>

<div class="image-grid">

<div class="image-slot">1</div>
<div class="image-slot">2</div>
<div class="image-slot">3</div>
<div class="image-slot">4</div>
<div class="image-slot">5</div>
<div class="image-slot">6</div>
<div class="image-slot">7</div>
<div class="image-slot">8</div>

</div>

</div>

<div class="card">

<h2 class="section-title">
2. معلومات السيارة
</h2>

<div class="grid">

<div>
<label>
اسم السيارة
<span class="required">*</span>
</label>

<input
id="car_name"
placeholder="مثال: Toyota"
>
</div>

<div>
<label>
نوع السيارة
<span class="required">*</span>
</label>

<input
id="vehicle_type"
placeholder="مثال: SUV"
>
</div>

<div>
<label>
موديل السيارة (4 أرقام فقط)
<span class="required">*</span>
</label>

<input
id="model"
maxlength="4"
inputmode="numeric"
placeholder="2024"
>
</div>

<div>
<label>
الممشى (حتى 12 رقم)
<span class="required">*</span>
</label>

<input
id="mileage"
maxlength="12"
inputmode="numeric"
placeholder="150000"
>
</div>

<div>
<label>
المدينة
<span class="required">*</span>
</label>

<input
id="city"
placeholder="الرياض"
>
</div>

<div>
<label>
لون السيارة
<span class="required">*</span>
</label>

<input
id="color"
placeholder="أبيض"
>
</div>

<div>
<label>
نوع القير
<span class="required">*</span>
</label>

<select id="gearbox">
<option value="">اختر</option>
<option>أوتوماتيك</option>
<option>عادي</option>
</select>
</div>

<div>
<label>
دبل
<span class="required">*</span>
</label>

<select id="four_wheel_drive">
<option value="">اختر</option>
<option>نعم</option>
<option>لا</option>
</select>
</div>

</div>

<label>
رقم الواتساب
<span class="required">*</span>
</label>

<input
id="whatsapp"
placeholder="9665xxxxxxxx"
>

<label>
ملاحظات السيارة
(حتى 700 حرف)
</label>

<textarea
id="notes"
maxlength="700"
placeholder="اكتب جميع ملاحظات السيارة هنا..."
></textarea>

<div class="counter">
700 حرف كحد أقصى
</div>

</div>

<!-- نهاية الجزء الأول -->
  <div class="card">

<h2 class="section-title">
3. المستندات
</h2>

<label>
تقرير الفحص PDF
</label>

<input
id="inspection_file"
type="file"
accept=".pdf"
>

<label>
صورة الاستمارة (اختياري)
</label>

<input
id="registration_image"
type="file"
accept="image/*"
>

</div>

<div class="card">

<div class="notice">

بعد التفعيل النهائي لا يمكن استخدام هذا الملصق على سيارة أخرى،
ولا يمكن تعديل المعلومات بعد الحفظ.

</div>

<br>

<button class="btn" type="button" onclick="saveVehicle()">
تفعيل السيارة وحفظ المعلومات
</button>
</div>

</div>
</div>

<script>

const SUPABASE_URL =
"https://brdjreihpwwkcqzhuhez.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XLbaaWE-6BuSrPsVGpxCdw_5e_Dltwa";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const params =
new URLSearchParams(
window.location.search
);

const tagCode =
params.get("tag") ||
"CAR-000001";
  async function checkExistingVehicle(){
  const { data, error } = await db
    .from("vehicles")
    .select("*")
    .eq("tag_code", tagCode)
    .maybeSingle();

  if(data && data.locked){
    showVehicle(data);
  }
}

function showVehicle(v){
  const imgs = (v.images || []).map(url => `
    <img src="${url}" style="width:100%;border-radius:14px;margin:10px 0;">
  `).join("");

  const whatsappLink = v.whatsapp
    ? `https://wa.me/${v.whatsapp}?text=${encodeURIComponent("مرحبا، شفت سيارتك عبر NABHINFO")}`
    : "#";

  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2 class="section-title">${v.car_name || "معلومات السيارة"}</h2>

      ${imgs || "<p>لا توجد صور</p>"}

      <p><b>نوع السيارة:</b> ${v.vehicle_type || "-"}</p>
      <p><b>الموديل:</b> ${v.model || "-"}</p>
      <p><b>الممشى:</b> ${v.mileage || "-"}</p>
      <p><b>المدينة:</b> ${v.city || "-"}</p>
      <p><b>اللون:</b> ${v.color || "-"}</p>
      <p><b>نوع القير:</b> ${v.gearbox || "-"}</p>
      <p><b>دبل:</b> ${v.four_wheel_drive ? "نعم" : "لا"}</p>
      <p><b>ملاحظات:</b><br>${v.notes || "-"}</p>

      ${v.inspection_file ? `<a href="${v.inspection_file}" target="_blank"><button class="btn">عرض تقرير الفحص</button></a>` : ""}
      ${v.registration_image ? `<a href="${v.registration_image}" target="_blank"><button class="btn" style="margin-top:10px">عرض الاستمارة</button></a>` : ""}

      ${v.whatsapp ? `<a href="${whatsappLink}" target="_blank"><button class="btn" style="margin-top:10px;background:#25D366">تواصل عبر واتساب</button></a>` : ""}

      <div class="notice">
        هذا الملصق مفعّل ومربوط بهذه السيارة فقط، وغير قابل للتعديل.
      </div>
    </div>
  `;
}

checkExistingVehicle();
async function uploadFile(bucket, file) {
  if (!file) return null;

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "-");
  const path = `${tagCode}/${Date.now()}-${safeName}`;

  const { error } = await db.storage
    .from(bucket)
    .upload(path, file);

  if (error) throw error;

  const { data } = db.storage
    .from(bucket)
    .getPublicUrl(path);

  return data.publicUrl;
}
async function saveVehicle(){
  alert("بدأ الحفظ");
  try{
    
    const imagesInput = document.getElementById("images");
const images = imagesInput && imagesInput.files ? Array.from(imagesInput.files) : [];
    
    if(images.length > 8){
      alert("يسمح فقط بـ 8 صور");
      return;
    }

    const imageUrls = [];

    for (const img of images) {
      imageUrls.push(await uploadFile("car images", img));
    }

    const inspectionFile =
      document.getElementById("inspection_file").files[0] || null;

    const registrationImage =
      document.getElementById("registration_image").files[0] || null;

    const inspectionUrl =
      await uploadFile("inspection-files", inspectionFile);

    const registrationUrl =
      await uploadFile("inspection-files", registrationImage);

    const model = document.getElementById("model").value;

    if(model.length !== 4){
      alert("الموديل يجب أن يكون 4 أرقام");
      return;
    }

    const mileage = document.getElementById("mileage").value;

    if(mileage.length > 12){
      alert("الممشى لا يتجاوز 12 رقم");
      return;
    }

    const notes = document.getElementById("notes").value;

    if(notes.length > 700){
      alert("الملاحظات لا تتجاوز 700 حرف");
      return;
    }

    const fourWheel =
      document.getElementById("four_wheel_drive").value === "نعم";

    const vehicleData = {
      tag_code: tagCode,
      car_name: document.getElementById("car_name").value,
      vehicle_type: document.getElementById("vehicle_type").value,
      model: model,
      mileage: mileage,
      city: document.getElementById("city").value,
      color: document.getElementById("color").value,
      gearbox: document.getElementById("gearbox").value,
      four_wheel_drive: fourWheel,
      whatsapp: document.getElementById("whatsapp").value,
      notes: notes,
      images: imageUrls,
      inspection_file: inspectionUrl,
      registration_image: registrationUrl,
      locked: true
    };

    const { error } = await db
      .from("vehicles")
      .insert(vehicleData);

    if(error) throw error;

 alert("تم حفظ بيانات السيارة بنجاح");

window.location.href =
window.location.pathname +
"?tag=" + tagCode +
"&view=1";

  }catch(err){
   console.error(err);
alert(
  "ERROR MESSAGE: " + (err.message || "no message") +
  "\nERROR CODE: " + (err.code || "no code") +
  "\nDETAILS: " + (err.details || "no details")
);
  }
}

window.onerror = function(message, source, lineno, colno, error) {
  alert("JS ERROR: " + message + " at line " + lineno);
};
</script>

</body>
</html>
